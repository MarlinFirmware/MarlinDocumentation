#
# Test Jekyll syntax for issues
#

name: Jekyll CI

on:
  pull_request:
    branches:
    - master
  push:
    branches:
    - wip-new-theme

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.repository == 'MarlinFirmware/MarlinDocumentation'
    steps:
    - name: PR Checkout
      uses: actions/checkout@v2
    - name: Ruby Setup
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3.4
        bundler-cache: true
    - name: Site Checks (YAML, navigation)
      run: |
        pip install pyyaml
        python3 _tools/check_site.py
    - name: Test Build
      run: bundle exec jekyll build
    - name: Built Site Checks (sidebar, links)
      run: |
        python3 _tools/check_site.py --built
        python3 _tools/check_links.py
        python3 _tools/check_feed.py
