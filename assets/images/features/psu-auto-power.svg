<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title>When automatic power control switches the supply on and off</title>
  <desc>A timeline. The PS_ON output goes on when a move or a heater target needs power (G28 or M104). Three bars show the reasons power is needed: steppers enabled and heater target above zero, both ending when the print ends, and the hotend being above AUTO_POWER_E_TEMP, which lasts until the hotend has cooled. After the last reason ends, the supply stays on for POWER_TIMEOUT seconds and then turns off.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5 0 10z" fill="#8a8f98"/>
    </marker>
    <style>
      .t     { fill: #8a8f98; }
      .tm    { fill: #8a8f98; text-anchor: middle; }
      .mono  { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
      .on    { fill: #e0813f; font-weight: 600; }
      .psu   { fill: none; stroke: #e0813f; stroke-width: 2.5; }
      .ev    { stroke: #8a8f98; stroke-width: 0.8; stroke-dasharray: 2 4; }
      .axis  { stroke: #8a8f98; stroke-width: 1; }
      .blue  { fill: rgba(44, 132, 250, 0.22); stroke: #5a8fd6; stroke-width: 1.2; }
      .teal  { fill: rgba(45, 212, 191, 0.22); stroke: #2dd4bf; stroke-width: 1.2; }
      .span  { fill: none; stroke: #8a8f98; stroke-width: 1.4; marker-start: url(#ag); marker-end: url(#ag); }
    </style>
  </defs>

  <!-- event markers -->
  <line class="ev" x1="200" y1="34" x2="200" y2="236"/>
  <line class="ev" x1="340" y1="34" x2="340" y2="236"/>
  <line class="ev" x1="440" y1="34" x2="440" y2="203"/>
  <line class="ev" x1="440" y1="228" x2="440" y2="236"/>
  <line class="ev" x1="515" y1="34" x2="515" y2="203"/>
  <line class="ev" x1="515" y1="228" x2="515" y2="236"/>

  <!-- PSU state -->
  <text class="t" x="12" y="52">Power supply</text>
  <text class="t mono" x="12" y="68">PS_ON</text>
  <path class="psu" d="M185 76 H200 V44 H515 V76 H545"/>
  <text class="on" x="356" y="38">ON</text>
  <text class="t" x="520" y="92">OFF</text>
  <text class="t" x="168" y="92">OFF</text>

  <!-- reasons power is needed -->
  <text class="t" x="12" y="122">Steppers enabled</text>
  <rect class="blue" x="200" y="111" width="140" height="16" rx="2"/>

  <text class="t" x="12" y="156">Heater target &gt; 0</text>
  <rect class="blue" x="200" y="145" width="140" height="16" rx="2"/>

  <text class="t" x="12" y="186">Hotend above</text>
  <text class="t mono" x="12" y="201">AUTO_POWER_E_TEMP</text>
  <rect class="teal" x="210" y="181" width="230" height="16" rx="2"/>

  <!-- timeout -->
  <line class="span" x1="442" y1="222" x2="513" y2="222"/>
  <text class="tm mono" x="477" y="214">POWER_TIMEOUT</text>

  <line class="axis" x1="185" y1="236" x2="545" y2="236"/>

  <!-- event labels -->
  <text class="tm" x="200" y="254">G28 or M104</text>
  <text class="tm" x="200" y="269">power on</text>
  <text class="tm" x="340" y="254">Print ends</text>
  <text class="tm" x="340" y="269">M84, heaters off</text>
  <text class="tm" x="440" y="254">Cooled</text>
  <text class="tm" x="515" y="254">Off</text>

  <text class="t" x="12" y="292">Not to scale. Marlin re-checks every 2.5 s while the status screen is shown.</text>
</svg>
