<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title>Cutter power over time in standard mode, continuous inline mode, and inline mode with LASER_POWER_TRAP</title>
  <desc>Three power-versus-time strips for the same kind of job. Top, standard mode: M3 S waits for queued moves to finish, then turns the output on while the axes are stopped; the power stays constant through the following G1 moves until M5 waits for the moves and turns it off. Middle, continuous inline mode (M3 I): each G1 carries its own S power, G0 travel moves are unpowered, and there are no pauses. Bottom, inline mode with LASER_POWER_TRAP: the power of each G1 ramps up while the move accelerates and down while it decelerates, never below the SPEED_POWER_MIN floor.</desc>
  <defs>
    <style>
      .t     { fill: #8a8f98; }
      .tm    { fill: #8a8f98; text-anchor: middle; }
      .te    { fill: #8a8f98; text-anchor: end; }
      .h     { fill: #8a8f98; font-weight: 600; }
      .mono  { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
      .red   { fill: #fb7185; font-size: 11px; }
      .teal  { fill: #2dd4bf; }
      .axis  { stroke: #8a8f98; stroke-width: 1.2; }
      .sep   { stroke: #8a8f98; stroke-width: 0.8; stroke-dasharray: 3 3; }
      .wait  { fill: rgba(136,136,136,0.22); }
      .pA    { fill: rgba(44,132,250,0.22); stroke: #5a8fd6; stroke-width: 2; stroke-linejoin: round; }
      .pB    { fill: rgba(224,129,63,0.22); stroke: #e0813f; stroke-width: 2; stroke-linejoin: round; }
      .pC    { fill: rgba(45,212,191,0.18); stroke: #2dd4bf; stroke-width: 2; stroke-linejoin: round; }
      .floor { stroke: #2dd4bf; stroke-width: 1; stroke-dasharray: 6 4; }
      .burn  { stroke: #fb7185; stroke-width: 4; }
    </style>
  </defs>

  <!-- ============ Strip A: standard mode ============ -->
  <text class="h" x="40" y="24">Standard mode: <tspan class="mono">M3 S180</tspan> … <tspan class="mono">M5</tspan> sets power between moves</text>
  <rect class="wait" x="120" y="36" width="30" height="64"/>
  <rect class="wait" x="430" y="36" width="30" height="64"/>
  <line class="sep" x1="290" y1="36" x2="290" y2="100"/>
  <path class="pA" d="M40 100 H135 V65 H430 V100 Z"/>
  <line class="burn" x1="135" y1="65" x2="150" y2="65"/>
  <text class="red" x="154" y="58">on while the axes are stopped</text>
  <line class="axis" x1="40" y1="100" x2="540" y2="100"/>
  <text class="tm mono" x="80" y="116">G0</text>
  <text class="tm mono" x="135" y="116">M3</text>
  <text class="tm mono" x="220" y="116">G1</text>
  <text class="tm mono" x="360" y="116">G1</text>
  <text class="tm mono" x="445" y="116">M5</text>
  <text class="tm mono" x="500" y="116">G0</text>

  <!-- ============ Strip B: continuous inline mode ============ -->
  <text class="h" x="40" y="154">Continuous inline mode (<tspan class="mono">M3 I</tspan>): power travels with each move</text>
  <line class="sep" x1="120" y1="166" x2="120" y2="230"/>
  <line class="sep" x1="260" y1="166" x2="260" y2="230"/>
  <line class="sep" x1="370" y1="166" x2="370" y2="230"/>
  <line class="sep" x1="430" y1="166" x2="430" y2="230"/>
  <path class="pB" d="M40 230 H120 V190 H260 V210 H370 V230 H430 V190 H540 V230 Z"/>
  <line class="axis" x1="40" y1="230" x2="540" y2="230"/>
  <text class="tm mono" x="80" y="246">G0</text>
  <text class="tm mono" x="190" y="246">G1 S200</text>
  <text class="tm mono" x="315" y="246">G1 S100</text>
  <text class="tm mono" x="400" y="246">G0</text>
  <text class="tm mono" x="485" y="246">G1 S200</text>

  <!-- ============ Strip C: inline + LASER_POWER_TRAP ============ -->
  <text class="h" x="40" y="284">Inline mode with <tspan class="mono">LASER_POWER_TRAP</tspan>: power follows the speed ramps</text>
  <line class="sep" x1="120" y1="296" x2="120" y2="360"/>
  <line class="sep" x1="260" y1="296" x2="260" y2="360"/>
  <line class="sep" x1="370" y1="296" x2="370" y2="360"/>
  <line class="sep" x1="430" y1="296" x2="430" y2="360"/>
  <line class="floor" x1="40" y1="353" x2="540" y2="353"/>
  <text class="teal mono" x="44" y="348">floor</text>
  <path class="pC" d="M40 360 H120 V353 L150 320 H232 L260 337 L282 340 H345 L370 353 V360 H430 V353 L460 320 H512 L540 353 V360 Z"/>
  <line class="axis" x1="40" y1="360" x2="540" y2="360"/>
  <text class="tm mono" x="190" y="376">G1 S200</text>
  <text class="tm mono" x="315" y="376">G1 S100</text>
  <text class="tm mono" x="80" y="376">G0</text>
  <text class="tm mono" x="400" y="376">G0</text>
  <text class="tm mono" x="485" y="376">G1 S200</text>

  <!-- footer -->
  <rect class="wait" x="40" y="396" width="14" height="10"/>
  <text class="t" x="60" y="405" font-size="11">planner waits for moves · floor = SPEED_POWER_MIN · not to scale</text>
  <text class="te" x="540" y="405" font-size="11">time →</text>
</svg>
