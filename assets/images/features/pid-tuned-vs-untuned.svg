<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="t d">
  <title id="t">Temperature over time with untuned and tuned PID</title>
  <desc id="d">Two temperature traces heating toward the same target. The untuned trace overshoots the target and keeps oscillating above and below it. The tuned trace rises, overshoots slightly once, and settles within a narrow band around the target.</desc>
  <style>
    .ax { stroke: #8a8f98; stroke-width: 1.2; fill: none; }
    .lbl { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a8f98; }
    .small { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a8f98; }
    .target { stroke: #8a8f98; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; }
    .band { fill: rgba(44,132,250,0.18); stroke: none; }
    .untuned { stroke: #e0813f; stroke-width: 2.2; fill: none; stroke-linejoin: round; }
    .tuned { stroke: #5a8fd6; stroke-width: 2.2; fill: none; stroke-linejoin: round; }
  </style>

  <line x1="60" y1="16" x2="88" y2="16" class="untuned"/>
  <text x="94" y="20" class="lbl">untuned: overshoot and oscillation</text>
  <line x1="310" y1="16" x2="338" y2="16" class="tuned"/>
  <text x="344" y="20" class="lbl">tuned: settles within 1–2 °C</text>

  <rect x="60" y="100" width="470" height="20" class="band"/>

  <polyline points="60,30 60,250 530,250" class="ax"/>
  <text x="530" y="268" text-anchor="end" class="lbl">time</text>
  <text x="14" y="38" class="lbl" transform="rotate(-90 14 38)" text-anchor="end">temperature</text>

  <line x1="60" y1="110" x2="530" y2="110" class="target"/>
  <text x="66" y="96" class="lbl">target</text>
  
