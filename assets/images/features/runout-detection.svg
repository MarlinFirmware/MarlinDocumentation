<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
  <title id="t">How Marlin decides that filament has run out</title>
  <desc id="d">Three rows. Top: a switch sensor without a runout distance; each check that reads filament present resets a counter to 5, each check that reads no filament lowers it by one, and the runout is declared when it drops below zero on the sixth check in a row. Middle: a switch sensor with FILAMENT_RUNOUT_DISTANCE_MM; once the switch opens, Marlin keeps printing that length of filament before running the script. Bottom: a motion sensor; every pin toggle resets the countdown, and when toggles stop for FILAMENT_RUNOUT_DISTANCE_MM of extrusion the script runs.</desc>
  <style>
    .lbl  { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a8f98; }
    .hdr  { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a8f98; }
    .sm   { font: 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a8f98; }
    .mono { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8a8f98; }
    .monoO { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e0813f; }
    .num  { font: 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e0813f; text-anchor: middle; }
    .red  { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #fb7185; }
    .track { stroke: #8a8f98; stroke-width: 1.5; }
    .tick  { stroke: #8a8f98; stroke-width: 1; stroke-dasharray: 3 3; }
    .pulse { stroke: #2dd4bf; stroke-width: 3; }
    .stop  { stroke: #fb7185; stroke-width: 3; }
  </style>

  <!-- Legend -->
  <rect x="20" y="16" width="12" height="12" rx="2" fill="#5a8fd6"/>
  <text class="lbl" x="38" y="27">filament present</text>
  <rect x="170" y="16" width="12" height="12" rx="2" fill="#e0813f"/>
  <text class="lbl" x="188" y="27">counting toward runout</text>
  <line class="pulse" x1="366" y1="15" x2="366" y2="29"/>
  <text class="lbl" x="376" y="27">motion pulse</text>
  <line class="stop" x1="490" y1="15" x2="490" y2="29"/>
  <text class="lbl" x="500" y="27">runout declared</text>

  <!-- Row A: switch, debounced count -->
  <text class="hdr" x="20" y="70">Switch sensor, no runout distance</text>
  <text class="mono" x="262" y="70">(FILAMENT_RUNOUT_THRESHOLD = 5)</text>
  <line class="track" x1="40" y1="100" x2="610" y2="100"/>
  <circle cx="60"  cy="100" r="7" fill="#5a8fd6"/>
  <circle cx="104" cy="100" r="7" fill="#5a8fd6"/>
  <circle cx="148" cy="100" r="7" fill="#5a8fd6"/>
  <circle cx="192" cy="100" r="7" fill="#5a8fd6"/>
  <circle cx="236" cy="100" r="7" fill="#5a8fd6"/>
  <circle cx="280" cy="100" r="7" fill="#5a8fd6"/>
  <circle cx="324" cy="100" r="7" fill="#5a8fd6"/>
  <line class="tick" x1="346" y1="80" x2="346" y2="118"/>
  <text class="sm" x="352" y="86">switch opens</text>
  <circle cx="368" cy="100" r="7" fill="#e0813f"/>
  <circle cx="412" cy="100" r="7" fill="#e0813f"/>
  <circle cx="456" cy="100" r="7" fill="#e0813f"/>
  <circle cx="500" cy="100" r="7" fill="#e0813f"/>
  <circle cx="544" cy="100" r="7" fill="#e0813f"/>
  <circle cx="588" cy="100" r="7" fill="#e0813f"/>
  <text class="num" x="368" y="126">4</text>
  <text class="num" x="412" y="126">3</text>
  <text class="num" x="456" y="126">2</text>
  <text class="num" x="500" y="126">1</text>
  <text class="num" x="544" y="126">0</text>
  <text class="num" x="588" y="126">−1</text>
  <line class="stop" x1="610" y1="86" x2="610" y2="114"/>
  <text class="red" x="618" y="105">runout</text>
  <text class="sm" x="40" y="126">“present” resets the counter to 5</text>
  <text class="sm" x="660" y="126">checks →</text>

  <!-- Row B: switch with runout distance -->
  <text class="hdr" x="20" y="168">Switch sensor with</text>
  <text class="mono" x="154" y="168">FILAMENT_RUNOUT_DISTANCE_MM</text>
  <line class="track" x1="40" y1="198" x2="610" y2="198"/>
  <rect x="40" y="193" width="300" height="10" fill="#5a8fd6"/>
  <rect x="340" y="193" width="270" height="10" fill="#e0813f"/>
  <line class="tick" x1="340" y1="178" x2="340" y2="214"/>
  <text class="sm" x="346" y="186">switch opens</text>
  <line class="stop" x1="610" y1="184" x2="610" y2="212"/>
  <text class="red" x="618" y="203">script runs</text>
  <text class="sm" x="40" y="222">present: countdown held at the full distance</text>
  <text class="monoO" x="475" y="222" text-anchor="middle">FILAMENT_RUNOUT_DISTANCE_MM</text>
  <text class="sm" x="634" y="222">extruded →</text>

  <!-- Row C: motion sensor -->
  <text class="hdr" x="20" y="266">Motion (encoder) sensor,</text>
  <text class="mono" x="196" y="266">FILAMENT_MOTION_SENSOR</text>
  <line class="track" x1="40" y1="296" x2="610" y2="296"/>
  <line class="pulse" x1="60"  y1="288" x2="60"  y2="304"/>
  <line class="pulse" x1="100" y1="288" x2="100" y2="304"/>
  <line class="pulse" x1="140" y1="288" x2="140" y2="304"/>
  <line class="pulse" x1="180" y1="288" x2="180" y2="304"/>
  <line class="pulse" x1="220" y1="288" x2="220" y2="304"/>
  <line class="pulse" x1="260" y1="288" x2="260" y2="304"/>
  <line class="pulse" x1="300" y1="288" x2="300" y2="304"/>
  <line class="pulse" x1="340" y1="288" x2="340" y2="304"/>
  <rect x="340" y="292" width="270" height="8" fill="#e0813f"/>
  <text class="sm" x="346" y="284">last toggle: filament stopped</text>
  <line class="stop" x1="610" y1="282" x2="610" y2="310"/>
  <text class="red" x="618" y="301">script runs</text>
  <text class="sm" x="40" y="320">each pin toggle resets the countdown</text>
  <text class="monoO" x="475" y="320" text-anchor="middle">FILAMENT_RUNOUT_DISTANCE_MM</text>
  <text class="sm" x="634" y="320">extruded →</text>

  <text class="sm" x="20" y="350">Not to scale. Lengths count filament extruded by the extruder that the sensor belongs to.</text>
</svg>
