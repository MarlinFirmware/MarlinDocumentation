<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="Cartesian motion: X, Y and Z each driven by their own motor"><title>Cartesian motion: X, Y and Z each driven by their own motor</title><style>
text{font:14px -apple-system,Helvetica,Arial,sans-serif;fill:#445}
.t{font-weight:600;fill:#223}
.f{fill:none;stroke:#667;stroke-width:3}
.b{fill:#e6e9ef;stroke:#99a;stroke-width:1.5}
.m{fill:#4a7bd0}.mb{fill:#d0704a}
.belt{fill:none;stroke:#4a7bd0;stroke-width:2.5}
.belt2{fill:none;stroke:#d0704a;stroke-width:2.5}
.a{stroke:#223;stroke-width:2;fill:none;marker-end:url(#ar)}
.arm{stroke:#556;stroke-width:4;stroke-linecap:round}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#223"/></marker></defs><rect width="560" height="300" fill="#fff"/>
<text x="20" y="28" class="t">Cartesian: one motor per axis</text>
<rect x="40" y="60" width="300" height="200" class="b"/>
<text x="150" y="165">bed</text>
<line x1="40" y1="120" x2="340" y2="120" class="f"/>
<rect x="170" y="105" width="40" height="30" rx="4" fill="#556"/><text x="176" y="100">head</text>
<rect x="18" y="108" width="22" height="24" class="m"/><text x="0" y="150" font-size="12">X motor</text>
<line x1="220" y1="120" x2="300" y2="120" class="a"/><text x="265" y="112">X</text>
<rect x="180" y="262" width="24" height="22" class="m"/><text x="210" y="282" font-size="12">Y motor (moves bed)</text>
<line x1="360" y1="230" x2="360" y2="90" class="a"/><text x="368" y="160">Y</text>
<g transform="translate(420,60)">
<text x="0" y="0" class="t">Side view</text>
<line x1="20" y1="20" x2="20" y2="190" class="f"/><line x1="110" y1="20" x2="110" y2="190" class="f"/>
<line x1="20" y1="80" x2="110" y2="80" class="f"/><rect x="55" y="70" width="20" height="20" fill="#556"/>
<rect x="5" y="190" width="120" height="10" class="b"/>
<rect x="10" y="200" width="20" height="20" class="m"/><rect x="100" y="200" width="20" height="20" class="m"/>
<line x1="125" y1="120" x2="125" y2="40" class="a"/><text x="112" y="140" font-size="12">Z (1–2 motors)</text>
</g></svg>