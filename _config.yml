name: 'Marlin Firmware'
title: 'Marlin Firmware'
logo: '/assets/images/logo/marlin/text-night.png'
description: 'Printing the planet, one layer at a time.'

baseurl: ''
url: 'https://marlinfw.org'
js: '/assets/javascript/'
destination: ./_site

exclude:
  - _config.yml
  - Gemfile
  - LICENSE
  - public
  - script
  - vendor
  - README.md
  - AGENTS.md
  - skills
  - assets/images/CREDITS.md
  - .hermes-tmp.*

#theme: jekyll-theme-documentation
#theme: jekyll-theme-minimal
theme: just-the-docs
#nav_enabled: true
#heading_anchors: false

color_scheme: marlin
back_to_top: true

# Callouts: {: .note } / {: .warning } / {: .important } / {: .highlight } before a blockquote
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: red
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  more:
    title: Want to Know More?
    color: blue

search_enabled: true
search.button: true
search.previews: 3
search.preview_words_before: 5
search.preview_words_after: 5

twitter:
  username: MarlinFirmware

social:
  name: Marlin Firmware
  links:
    - https://fosstodon.org/@marlinfirmware
    - https://x.com/marlinfirmware
    - https://bsky.app/profile/marlinfw.org
    - https://www.facebook.com/groups/1049718498464482/
    - http://forums.reprap.org/list.php?415
    - https://discord.com/servers/marlin-firmware-461605380783472640

github:
  repository_name: 'MarlinFirmware/MarlinDocumentation'
#  repository_url:

repository:
  main: 'https://github.com/MarlinFirmware/Marlin'
  doc: 'https://github.com/MarlinFirmware/MarlinDocumentation'
  config: 'https://github.com/MarlinFirmware/Configurations'
  builds: 'https://github.com/MarlinFirmware/MarlinBuilds'
  autobuild: 'https://github.com/MarlinFirmware/AutoBuildMarlin'

# Google Analytics Tracking (optional)
ga_tracking: UA-76230130-10
ga_tracking_anonymize_ip: true # Use GDPR compliant Google Analytics settings (true/nil by default)

analytics:
  id: 'UA-76230130-1'
  domain: 'marlinfw.org'

markdown: kramdown
highlighter: rouge
timezone: 'America/Chicago'

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-redirect-from
  - jekyll-bootstrap-sass
  - jekyll-tidy
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-toc
  - jekyll-seo-tag

sass:
    style: compressed

jekyll_tidy:
  compress_html: true
  exclude: ["*.js"]
  # ignore_env: development

collections:
  basics:
    output: true
    permalink: /docs/:collection/:path:output_ext

  development:
    output: true
    title: Development
    permalink: /docs/:collection/:path:output_ext

  gcode:
    output: true
    title: G-code
    permalink: /docs/:collection/:path:output_ext

#toc:
#  min_level: 2 # default: 1
#  max_level: 5 # default: 6

defaults:
  - # All types
    scope:
      path: '' # all files
    values:
      layout: default
      author: MarlinFirmware
      category: [ default ]
      show:
        navbar: true
        footer: true
        breadcrumbs: false

  - # Basics collection
    scope:
      type: basics
      path: 'docs/basics'
    values:
      layout: page

  - # Development pages
    scope:
      path: 'docs/development'
    values:
      layout: page

  - # Feature overview pages
    scope:
      path: 'docs/features'
    values:
      layout: article

  - # Printer type pages
    scope:
      path: 'docs/printers'
    values:
      layout: article

  - # G-code pages
    scope:
      path: 'docs/gcode'
    values:
      layout: gcode
      category: [ gcode ]

  - # Settings pages (generated by _tools/gen_settings.py)
    scope:
      path: 'docs/settings'
    values:
      layout: setting

  - # Appendix pages
    scope:
      path: 'docs/appendix'
    values:
      layout: page

# SEO Stuff
author: Marlin Firmware
summary: Documentation for the Marlin Firmware project.
lang: en
locale: en_US

# RSS feeds
feed:
  posts_limit: 20

# Obtrusive links not properly styled
#aux_links:
#  Just the Docs on GitHub:
#    - https://github.com/just-the-docs/just-the-docs

# Just the Docs theme configuration
just_the_docs:
  # Sections are driven by page `parent:` + `nav_order` frontmatter,
  # so named collections are intentionally omitted to avoid empty
  # `nav-category` dividers at the bottom of the sidebar.

aux_links:
  GitHub: https://github.com/MarlinFirmware/Marlin
  ❤️ Donate: /docs/basics/contributing.html#donate
